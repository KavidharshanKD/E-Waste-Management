server:
  port: ${PORT:8080}

spring:
  application:
    name: e-waste-management-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ewastedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT:60000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      keepalive-time: ${DB_KEEPALIVE_TIME:30000}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JFV2FzdGVNYW5hZ2VtZW50U3lzdGVtMjAyNg==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}

